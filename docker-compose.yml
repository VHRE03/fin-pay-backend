services:
  postgres:
    image: postgres:16-alpine
    container_name: fin-pay-postgres
    environment:
      POSTGRES_DB: finpay_db
      POSTGRES_USER: finpay_user
      POSTGRES_PASSWORD: finpay_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U finpay_user -d finpay_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: fin-pay-kafka
    ports:
      - "9092:9092"
    environment:
      # Imagen oficial apache/kafka: usa prefijo KAFKA_* (no el KAFKA_CFG_* de Bitnami).
      # KAFKA_<NOMBRE_CON_GUIONES> se traduce a la propiedad con puntos, p.ej. process.roles
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Broker unico: los topicos internos no pueden pedir 3 replicas
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    # Sin volumen: el montaje anterior apuntaba a /bitnami/kafka (ruta de la imagen Bitnami,
    # que apache/kafka no usa). El almacenamiento es efimero: los topics se recrean al levantar.

volumes:
  postgres_data: